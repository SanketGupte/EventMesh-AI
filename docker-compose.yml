version: '3.9'

services:

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: eventmesh-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@eventmesh-kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

  postgres-dev:
    image: postgres:16
    container_name: eventmesh-postgres-dev

    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: eventmesh_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # Ensure container timezone uses the modern IANA name (Asia/Kolkata) to avoid
      # Postgres rejecting deprecated zone names like Asia/Calcutta
      TZ: Asia/Kolkata

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventmesh_dev || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

    volumes:
      - postgres-dev-data:/var/lib/postgresql/data

  postgres-sit:
    image: postgres:16
    container_name: eventmesh-postgres-sit

    ports:
      - "5433:5432"

    environment:
      POSTGRES_DB: eventmesh_sit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - postgres-sit-data:/var/lib/postgresql/data

  postgres-uat:
    image: postgres:16
    container_name: eventmesh-postgres-uat

    ports:
      - "5434:5432"

    environment:
      POSTGRES_DB: eventmesh_uat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - postgres-uat-data:/var/lib/postgresql/data

  postgres-prod:
    image: postgres:16
    container_name: eventmesh-postgres-prod

    ports:
      - "5435:5432"

    environment:
      POSTGRES_DB: eventmesh_prod
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - postgres-prod-data:/var/lib/postgresql/data

volumes:
  postgres-dev-data:
  postgres-sit-data:
  postgres-uat-data:
  postgres-prod-data: