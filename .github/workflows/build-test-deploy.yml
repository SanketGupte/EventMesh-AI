name: Build-Test-Deploy

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:

  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: eventmesh_db
          POSTGRES_USER: eventmesh_user
          POSTGRES_PASSWORD: eventmesh_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      kafka:
        image: confluentinc/cp-kafka:7.6.0
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          CLUSTER_ID: MkU3OEVCNTcwNTJENDM2Qk
        ports:
          - 9092:9092

    steps:

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build Project
        run: mvn clean install -DskipTests

      - name: Run Unit Tests
        run: mvn test -P test

      - name: Run Integration Tests
        run: mvn verify -P integration-test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/eventmesh_db
          SPRING_DATASOURCE_USERNAME: eventmesh_user
          SPRING_DATASOURCE_PASSWORD: eventmesh_password
          SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092

      - name: SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          mvn sonar:sonar \
            -Dsonar.organization=$SONAR_ORGANIZATION \
            -Dsonar.projectKey=$SONAR_PROJECT_KEY \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.token=$SONAR_TOKEN

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false

  docker:
    runs-on: ubuntu-latest
    needs: build

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Ingestion Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ingestion-runtime
          push: true
          tags: |
            sanketgupte/ingestion-service:latest
            sanketgupte/ingestion-service:${{ github.sha }}

      - name: Build Routing Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: routing-runtime
          push: true
          tags: |
            sanketgupte/routing-service:latest
            sanketgupte/routing-service:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: docker

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Configure Kubectl
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config

      - name: Deploy Kubernetes Resources
        run: |
          kubectl apply -f k8s/

      - name: Verify Ingestion Deployment
        run: |
          kubectl rollout status deployment/ingestion-service -n eventmesh

      - name: Verify Routing Deployment
        run: |
          kubectl rollout status deployment/routing-service -n eventmesh