spring:
  application:
    name: routing-service
  datasource:
    url: jdbc:postgresql://localhost:5432/eventmesh
    username: postgres
    password: postgres

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

  kafka:
    bootstrap-servers: localhost:9092