spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/eventmesh_dev
    username: postgres
    password: postgres

  kafka:
    bootstrap-servers: localhost:9092

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

logging:
  level:
    root: DEBUG
    org.springframework: INFO

app:
  env: dev