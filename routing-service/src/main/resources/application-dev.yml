spring:
  datasource:
    # allow overriding via environment variables for local/dev convenience
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/eventmesh_dev}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    hikari:
      initialization-fail-timeout: -1

  kafka:
    bootstrap-servers: localhost:9092

  jpa:
    hibernate:
      ddl-auto: update
    # Explicit dialect to avoid Hibernate boot-time failure when DB is temporarily unavailable
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

logging:
  level:
    root: DEBUG
    org.springframework: INFO

app:
  env: dev